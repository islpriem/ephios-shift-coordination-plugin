[project]
name = "ephios-shift-coordination-plugin"
version = "0.1.0"
description = "Availability surveys and service planning for ephios"
authors = [{ name = "Felix Triebel", email = "felix@triebel.me" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ephios==0.27.0",
    "holidays>=0.80,<1",
    "scipy==1.17.1",
]

[project.entry-points."ephios.plugins"]
ephios_shift_coordination = "ephios_shift_coordination.apps.PluginApp"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ephios_shift_coordination"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/.gitignore"]

[dependency-groups]
dev = [
    "coverage>=7.13,<8",
    "djlint>=1.36,<2",
    "playwright>=1.55,<2",
    "psycopg[binary]>=3.2,<4",
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.15.8,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --basetemp=.local/tmp/pytest -m 'not e2e'"
markers = ["e2e: browser tests against the isolated Compose stack", "postgres: requires PostgreSQL", "performance: bounded optimizer load tests"]
filterwarnings = ['error:DateTimeField .* received a naive datetime']

[tool.coverage.run]
source = ["ephios_shift_coordination"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.coverage.html]
directory = ".local/test-results/coverage/html"

[tool.coverage.xml]
output = ".local/test-results/coverage/coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".local", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/settings.py" = ["E402", "F403", "F405"]

[tool.djlint]
profile = "django"
indent = 4
max_line_length = 100
