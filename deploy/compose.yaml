services:
  app:
    platform: linux/amd64
    build:
      context: ../.local/build
    environment:
      DEBUG: "True"
      EPHIOS_TESTING: "1"
      TRUST_X_FORWARDED_PROTO: "False"
      DATA_DIR: /var/ephios/data
      DATABASE_URL: postgres://ephios:test-password@database/ephios_test
      CACHE_URL: redis://cache/0
      ALLOWED_HOSTS: localhost,127.0.0.1,app
      SITE_URL: http://127.0.0.1:${EPHIOS_HTTP_PORT:-8097}
      EMAIL_URL: smtp://mail:1025
      DEFAULT_FROM_EMAIL: noreply@example.invalid
      SERVER_EMAIL: server@example.invalid
      ADMINS: Test Admin <admin@example.invalid>
    volumes:
      - ${EPHIOS_DATA_ROOT:?Set EPHIOS_DATA_ROOT}/ephios:/var/ephios/data
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
      mail:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/src/ephios/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/accounts/login/')"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ephios_test
      POSTGRES_USER: ephios
      POSTGRES_PASSWORD: test-password
    volumes:
      - ${EPHIOS_DATA_ROOT:?Set EPHIOS_DATA_ROOT}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${EPHIOS_DATABASE_PORT:-5497}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephios -d ephios_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${EPHIOS_DATA_ROOT:?Set EPHIOS_DATA_ROOT}/redis:/data

  mail:
    image: axllent/mailpit:v1.27
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - ${EPHIOS_DATA_ROOT:?Set EPHIOS_DATA_ROOT}/mail:/data
    ports:
      - "127.0.0.1:${EPHIOS_MAIL_PORT:-8098}:8025"

  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${EPHIOS_HTTP_PORT:-8097}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EPHIOS_DATA_ROOT:?Set EPHIOS_DATA_ROOT}/ephios:/var/ephios/data:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/accounts/login/"]
      interval: 2s
      timeout: 5s
      retries: 30
